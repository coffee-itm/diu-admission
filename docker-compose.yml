services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate().ok }"
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  mongo_data:
