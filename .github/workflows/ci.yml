name: CI

on: [push, pull_request]

env:
  # Single source of truth for the CI mongod pin: also used for the binary cache key below.
  # Keep in sync with the MONGOMS_VERSION fallback in server/test/helpers/app.js.
  MONGO_VERSION: '7.0.14'

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGO_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:coverage
        env:
          MONGOMS_VERSION: ${{ env.MONGO_VERSION }}
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            packages/shared/coverage/
            server/coverage/
          if-no-files-found: warn
          retention-days: 14
